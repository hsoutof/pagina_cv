<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Experiences</title>
        <style>          
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #f0f2f5;
                color: #333;
                line-height: 1.6;
                padding: 40px 20px;
                max-width: 800px;
                margin: 0 auto;
            }

            h1 {
                background-color: #1e293b;
                color: white;
                text-align: center;
                padding: 30px;
                border-radius: 12px;
                margin-bottom: 30px;
                font-size: 2.5rem;
                letter-spacing: 1px;
            }

            h2 {
                color: #2563eb;
                font-size: 1.4rem;
                margin-bottom: 15px;
                border-bottom: 2px solid #2563eb;
                padding-bottom: 8px;
            }

            ul {
                list-style: none;
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                margin-bottom: 30px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            }

            li {
                padding: 12px 15px;
                margin-bottom: 10px;
                background-color: #f8fafc;
                border-left: 4px solid #2563eb;
                border-radius: 4px;
                transition: transform 0.2s, background-color 0.2s;
            }

            li:hover {
                background-color: #dbeafe;
                transform: translateX(5px);
            }

            li:last-child {
                margin-bottom: 0;
            }
        </style>
    </head>
    <body>
        <h1>Hugo Souto Fernández-Vilanova</h1>
        <h2>Academic experiences:</h2>
        <ul>
            <li>Science & technology bachelor</li>
            <li>Web Application Development (Vocational Training)</li>
        </ul>
        <h2>Professional experiences:</h2>
        <ul>
            <li>None</li>
        </ul>
    </body>
</html>
