<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Experiencias</title>
        <style>          
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #f0f2f5;
                color: #333;
                line-height: 1.6;
                padding: 40px 20px;
                max-width: 800px;
                margin: 0 auto;
            }

            h1 {
                background-color: #1e293b;
                color: white;
                text-align: center;
                padding: 30px;
                border-radius: 12px;
                margin-bottom: 30px;
                font-size: 2.5rem;
                letter-spacing: 1px;
            }

            h2 {
                color: #2563eb;
                font-size: 1.4rem;
                margin-bottom: 15px;
                border-bottom: 2px solid #2563eb;
                padding-bottom: 8px;
            }

            ul {
                list-style: none;
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                margin-bottom: 30px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            }

            li {
                padding: 12px 15px;
                margin-bottom: 10px;
                background-color: #f8fafc;
                border-left: 4px solid #2563eb;
                border-radius: 4px;
                transition: transform 0.2s, background-color 0.2s;
            }

            li:hover {
                background-color: #dbeafe;
                transform: translateX(5px);
            }

            li:last-child {
                margin-bottom: 0;
            }
        </style>
    </head>
    <body>
        <h1>Hugo Souto Fernández-Vilanova</h1>

        <h2>Experiencias académicas:</h2>
        <ul id="lista_academica"></ul>

        <h2>Experiencias profesionales:</h2>
        <ul id="lista_profesional"></ul>
    </body>
    <script>
        const exp_academica = [
            {
                "titulo": "GS Desarrollo de Aplicaciones Web",
                "periodo": "2025-2027",
                "centro": "CPR Afundacion A Coruña"
            },
            {
                "titulo": "Bachillerato de Ciencias y Tecnología",
                "periodo": "2023-2025",
                "centro": "IES María Casares"
            }
        ]
        const exp_profesional = [
            {
                "titulo": "Ninguna"
            }
        ]

        const list_exp_acad = document.getElementById("lista_academica")
        const list_exp_prof = document.getElementById("lista_profesional")

        exp_academica.forEach(function(experiencia) {
            const li = document.createElement("li");

            li.textContent = experiencia.titulo + " (" + experiencia.periodo + ") - " + experiencia.centro;
            list_exp_acad.appendChild(li);
        });

        exp_profesional.forEach(function(experiencia) {
            const li = document.createElement("li");

            li.textContent = experiencia.titulo;
            list_exp_prof.appendChild(li);
        });
    </script>
</html>
